[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "kimai-mcp"
version = "2.15.1"
description = "MCP server for Kimai time-tracking API integration"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [
    {name = "Kimai MCP Contributors"},
]
keywords = ["kimai", "mcp", "time-tracking", "model-context-protocol", "api"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
# Upper bounds are deliberate: without them Dependabot never opens a PR for this
# project (it only files updates that change a constraint), which is how the
# breaking mcp 2.0.0 release reached users unannounced (#21).
dependencies = [
    "mcp>=2.0.0,<3",
    "httpx>=0.24.0,<1",
    "pydantic>=2.0.0,<3",
    "python-dotenv>=1.0.0,<2",
]

[project.optional-dependencies]
server = [
    "fastapi>=0.104.0",
    "uvicorn[standard]>=0.24.0",
    "PyJWT[crypto]>=2.8.0",
]
dev = [
    "pytest>=7.0.0",
    "pytest-asyncio>=0.21.0",
    "pytest-httpx>=0.21.0",
    "black>=23.0.0",
    # Pinned to one minor: ruff 0.16.0 grew the default rule set from 59 to 413
    # rules, which turned CI red on every PR. Keeping the range narrow means a
    # future default change arrives as a Dependabot PR instead of a broken build.
    "ruff>=0.16,<0.17",
    "build>=1.0.0",
]

[project.urls]
Homepage = "https://github.com/glazperle/kimai_mcp"
Repository = "https://github.com/glazperle/kimai_mcp"
"Bug Tracker" = "https://github.com/glazperle/kimai_mcp/issues"

[project.scripts]
kimai-mcp = "kimai_mcp.server:entrypoint"
kimai-mcp-streamable = "kimai_mcp.streamable_http_server:main"

[tool.hatch.build.targets.wheel]
packages = ["src/kimai_mcp"]
