[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "kimai-mcp"
version = "2.16.0"
description = "MCP server for Kimai time-tracking API integration"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [
    {name = "Kimai MCP Contributors"},
]
keywords = ["kimai", "mcp", "time-tracking", "model-context-protocol", "api"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
# Upper bounds are deliberate: without them Dependabot never opens a PR for this
# project (it only files updates that change a constraint), which is how the
# breaking mcp 2.0.0 release reached users unannounced (#21).
dependencies = [
    "mcp>=2.0.0,<3",
    "httpx>=0.24.0,<1",
    "pydantic>=2.0.0,<3",
    "python-dotenv>=1.0.0,<2",
]

[project.optional-dependencies]
server = [
    # fastapi was dropped in 2.16.0 with the SSE server, its only importer; the
    # streamable server is plain Starlette (which mcp brings) plus uvicorn.
    "uvicorn[standard]>=0.24.0,<1",
    "PyJWT[crypto]>=2.8.0,<3",
]
dev = [
    "pytest>=7.0.0",
    "pytest-asyncio>=0.21.0",
    "pytest-httpx>=0.21.0",
    "black>=23.0.0",
    # Pinned to one minor: ruff 0.16.0 grew the default rule set from 59 to 413
    # rules, which turned CI red on every PR. Keeping the range narrow means a
    # future default change arrives as a Dependabot PR instead of a broken build.
    "ruff>=0.16,<0.17",
    "build>=1.0.0",
]

[project.urls]
Homepage = "https://github.com/glazperle/kimai_mcp"
Repository = "https://github.com/glazperle/kimai_mcp"
"Bug Tracker" = "https://github.com/glazperle/kimai_mcp/issues"

[project.scripts]
kimai-mcp = "kimai_mcp.server:entrypoint"
kimai-mcp-streamable = "kimai_mcp.streamable_http_server:main"

[tool.hatch.build.targets.wheel]
packages = ["src/kimai_mcp"]

[tool.ruff]
# target-version is taken from project.requires-python (3.10).
# The code predates any line-length rule and E501 is not part of the rule set
# below; this value is what `ruff format` would use and documents the intent.
line-length = 120

[tool.ruff.lint]
# Baseline: ruff's default rule set (413 rules as of 0.16), which the [dev]
# extra pins to one minor so it cannot shift underneath a release. On top of it:
#
#   C4   comprehension clarity        PT   pytest style (parametrize, raises)
#   N    PEP 8 naming                 PTH  pathlib over os.path/open
#
# Deliberately NOT enabled, with the finding count each would add today:
#   ANN (397) and D (289) - annotating and docstring-ing every helper is not
#     how this codebase documents itself; the tool schemas are the contract.
#   TRY (179) and EM (152) - would rewrite every raise site of the ToolError
#     pattern, whose message text is user-visible and asserted in tests.
#   ARG (42) - handlers deliberately accept a uniform signature and ignore
#     arguments that do not apply to their action.
#   TID (41) - the lazy, function-local imports it flags are intentional
#     (optional [server] dependencies, import-cycle breaks).
extend-select = ["C4", "N", "PT", "PTH"]

[tool.ruff.lint.per-file-ignores]
# Tests construct throwaway servers and providers; reaching into a private
# helper is the point of a regression test.
"tests/*" = ["SLF001"]
